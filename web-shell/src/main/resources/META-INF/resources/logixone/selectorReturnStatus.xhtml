<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:h="jakarta.faces.html">
<cc:interface/>
<cc:implementation>
    <h:panelGroup layout="block" rendered="#{nativeSelectorReturn.returnAvailable}"
                  styleClass="selector-return-banner" role="region"
                  aria-label="Retorno al formulario de origen">
        <div>
            <strong>Administración contextual</strong>
            <span>Al volver se refrescarán las opciones y se recuperará el borrador seguro.</span>
        </div>
        <h:form styleClass="selector-return-form" includeViewParams="true">
            <input type="hidden" name="selectorContext" value="#{nativeSelectorReturn.selectorContextId}"/>
            <h:commandLink value="#{nativeSelectorReturn.returnLabel}"
                           action="#{nativeSelectorReturn.returnToOrigin}"
                           styleClass="button button-tonal"/>
        </h:form>
    </h:panelGroup>
    <h:panelGroup layout="block" rendered="#{nativeSelectorReturn.restored}"
                  styleClass="screen-notice screen-notice-success selector-native-restored"
                  role="status">
        <strong>Opciones actualizadas</strong>
        <span>Se recuperó el borrador seguro. Ya puedes elegir los valores disponibles.</span>
    </h:panelGroup>
</cc:implementation>
</html>
