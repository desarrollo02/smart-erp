<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dependencias y composición de plugins de Sprint 10</title>
  <desc id="desc">Cinco plugins productivos y tres fixtures se seleccionan en with-purchasing-demo. Las flechas sólidas indican dependencias funcionales requeridas y las discontinuas composición física hacia WAR y migrador.</desc>
  <defs>
