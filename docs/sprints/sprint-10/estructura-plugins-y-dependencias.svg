      .node{font:700 16px Arial;fill:#183153;text-anchor:middle}.version{font:14px Arial;fill:#52667a;text-anchor:middle}
      .dep{fill:none;stroke:#34495e;stroke-width:2;marker-end:url(#arrow)}.physical{fill:none;stroke:#16835b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .label{font:12px Arial;fill:#34495e;text-anchor:middle}.legend{font:14px Arial;fill:#34495e}
