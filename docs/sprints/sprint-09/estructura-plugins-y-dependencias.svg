<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Dependencias y composición de plugins de Sprint 9</title>
  <desc id="desc">Cinco plugins productivos y tres fixtures forman el perfil with-purchasing-demo. Las flechas verdes muestran dependencias funcionales requeridas; las moradas discontinuas muestran composición hacia el conjunto, WAR y migrador.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#217a4a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f4ab7"/></marker>
    <style>
